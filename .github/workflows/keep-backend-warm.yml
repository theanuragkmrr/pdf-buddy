name: Keep Render backend warm

on:
  schedule:
    # Every 10 minutes — comfortably under Render free tier's ~15 min idle
    # sleep threshold, so the backend never actually goes cold.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://pdf-buddy-t4uv.onrender.com/actuator/health
